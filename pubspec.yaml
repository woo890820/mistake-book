name: mistake_book
description: 轻量化错题本收集 APP - 多账户、多学科、拍照收集、AI 自动识题、文档导出打印
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # 状态管理
  provider: ^6.1.2

  # 本地数据库
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # 配置存储（保存 AI Key）
  shared_preferences: ^2.3.2

  # 网络请求（调用 AI 接口）
  http: ^1.2.2

  # 拍照与相册
  image_picker: ^1.1.2
  # 拍照后选框裁剪
  crop_your_image: ^1.1.0
  permission_handler: ^11.3.1

  # 文档导出
  docx_template: ^0.4.0
  pdf: ^3.11.1
  printing: ^5.13.2

  # 分享与外部打开
  share_plus: ^10.0.2
  open_filex: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - mistake_template.docx
